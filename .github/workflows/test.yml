name: Run Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          enable-cache: true
          python-version: "3.9"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest
